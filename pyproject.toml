[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psl-agy-harness"
version = "0.1.0"
description = "Empirical audit and official extension harness for Google Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Purrfect Software Limited (PSL)" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
psl-audit = "pipeline.extract_transcripts:main"
psl-inventory = "pipeline.inventory_customizations:main"
psl-classify = "pipeline.classify_failures:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "harness"]

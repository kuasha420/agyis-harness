[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agyis-harness"
version = "1.0.0-rc5"
description = "Autonomous agent runtime harness and immune system for Google Antigravity™"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Arafat Zahan (@kuasha420)" },
    { name = "Purrfect Software Limited (PSL)" },
]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kuasha420/agyis-harness"
Documentation = "https://github.com/kuasha420/agyis-harness#readme"
Repository = "https://github.com/kuasha420/agyis-harness"
"Bug Tracker" = "https://github.com/kuasha420/agyis-harness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
]

[project.scripts]
agyis = "harness.cli:main"
psl = "harness.cli:deprecated_psl_main"
agyis-doctor = "harness.runtime.doctor:main"
psl-doctor = "harness.runtime.doctor:deprecated_psl_doctor_main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

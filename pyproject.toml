[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psl-agy-harness"
version = "0.1.0"
description = "Empirical audit and official extension harness for Google Antigravity"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Purrfect Software Limited (PSL)" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
]

[project.scripts]
psl = "harness.cli:main"
psl-doctor = "harness.runtime.doctor:main"
psl-audit = "pipeline.extract_transcripts:main"
psl-inventory = "pipeline.inventory_customizations:main"
psl-classify = "pipeline.classify_failures:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

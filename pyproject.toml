[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psl-agy-harness"
version = "0.1.0"
description = "Empirical audit and official extension harness for Google Antigravity"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Purrfect Software Limited (PSL)" }
]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kuasha420/psl-agy-harness"
Documentation = "https://github.com/kuasha420/psl-agy-harness#readme"
Repository = "https://github.com/kuasha420/psl-agy-harness"
"Bug Tracker" = "https://github.com/kuasha420/psl-agy-harness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
]

[project.scripts]
psl = "harness.cli:main"
psl-doctor = "harness.runtime.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

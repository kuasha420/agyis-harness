name: Feature Request
description: Propose an idea, architectural enhancement, hook refinement, or new skill for agyis-harness
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement to `agyis-harness`!
        
        Please provide a detailed problem statement, motivation, and proposed design adhering to our architectural invariants (ADR-014, ADR-015).
  - type: input
    id: harness_version
    attributes:
      label: Agyis Harness Version (Optional)
      description: Active agyis-harness release version or git commit SHA (e.g. from `agyis --version` or `git rev-parse --short HEAD`).
      placeholder: "e.g., 1.0.0-rc3 or ea9fa04"
    validations:
      required: false
  - type: textarea
    id: proposal_summary
    attributes:
      label: Proposal Summary & Motivation
      description: Is your feature request related to a problem or limitation? A clear and concise description of the proposal and why it is needed.
      placeholder: "Describe the problem and motivation for this feature..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Implementation Concept
      description: A clear and concise description of how you envision this working (CLI palette, hook event, skill structure, API contract).
      placeholder: "Describe the proposed solution, command, or hook behavior..."
    validations:
      required: true
  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered (Optional)
      description: Any alternative solutions, features, or workarounds you have considered.
      placeholder: "Describe any alternative approaches or workarounds..."
    validations:
      required: false
  - type: textarea
    id: architectural_impact
    attributes:
      label: Architectural Context & Invariant Impact (Optional)
      description: Does this touch ADR-014 (product vs project bifurcation), ADR-015 (sub-second benchmark invariant), or lifecycle hooks?
      placeholder: "e.g., Touches completion fence, zero-dep product invariant, etc."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / References (Optional)
      description: Add any other context, mockups, or links to relevant discussions here.
    validations:
      required: false

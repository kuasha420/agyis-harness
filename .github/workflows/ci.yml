name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Hermetic Verification & Wheel Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify lockfile and install frozen dependencies
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --extra dev

      - name: Verify root hooks.json symlink and cleanroom specs
        run: |
          set -euo pipefail
          test -L hooks.json
          test "$(readlink hooks.json)" = "harness/hooks/hooks.json"
          uv run --frozen python3 -m harness.cli verify --spec

      - name: Run static governance & schema gates
        run: |
          set -euo pipefail
          uv run --frozen python3 -m harness.cli agents validate --json
          uv run --frozen python3 -m harness.cli rules --lint
          uv run --frozen python3 -m harness.cli audit aff
          uv run --frozen python3 -m harness.cli doctor --anti-synthetic --test-path tests

      - name: Run full hermetic test suite
        run: |
          set -euo pipefail
          uv run --frozen python3 -m harness.cli test

      - name: Build and smoke-test wheel in isolated environment
        run: |
          set -euo pipefail
          uv build --clear
          shopt -s nullglob
          WHL_FILES=(dist/agyis_harness-*.whl)
          test "${#WHL_FILES[@]}" -eq 1
          ABS_WHL="$(realpath "${WHL_FILES[0]}")"
          TMP_SMOKE="$(mktemp -d)"
          trap 'rm -rf "$TMP_SMOKE"' EXIT
          cd "$TMP_SMOKE"
          uv run --no-project --isolated --with "$ABS_WHL" python3 - <<'PY'
          import importlib.resources as ir
          from pathlib import Path
          import harness
          from harness.agents import resolve_agent_name

          assert "site-packages" in str(Path(harness.__file__).resolve()), harness.__file__
          assert resolve_agent_name("builder") == "agyis_builder"
          assert (ir.files("harness.gui.assets") / "hud.js").is_file()
          assert (ir.files("harness.hooks") / "hooks.json").is_file()
          assert (ir.files("harness.runtime") / "matrix.json").is_file()
          assert (ir.files("harness.agents") / "agyis_builder.md").is_file()
          assert (ir.files("harness") / "plugin.json").is_file()
          print("CI isolated wheel importlib.resources check passed.")
          PY

          uv venv "$TMP_SMOKE/venv" --python 3.12
          uv pip install --python "$TMP_SMOKE/venv/bin/python" "$ABS_WHL"
          SAMPLE_REPO="$TMP_SMOKE/sample-repo"
          mkdir -p "$SAMPLE_REPO/pkg" "$SAMPLE_REPO/tests"
          git -C "$SAMPLE_REPO" init -q
          cat > "$SAMPLE_REPO/pkg/__init__.py" <<'EOF'
          """Sample Python package."""
          def add(a: int, b: int) -> int:
              """Return sum."""
              return a + b
          EOF
          cat > "$SAMPLE_REPO/tests/test_sample.py" <<'EOF'
          from pathlib import Path
          import sys
          import unittest

          sys.path.insert(0, str(Path(__file__).resolve().parent.parent))
          from pkg import add

          class SampleTest(unittest.TestCase):
              def test_add(self) -> None:
                  self.assertEqual(add(2, 3), 5)
          EOF
          export HOME="$TMP_SMOKE/home"
          export AGYIS_CONFIG_DIR="$TMP_SMOKE/cfg"
          export PSL_HARNESS_STATE_DIR="$TMP_SMOKE/state"
          mkdir -p "$HOME" "$AGYIS_CONFIG_DIR" "$PSL_HARNESS_STATE_DIR"
          cd "$SAMPLE_REPO"
          "$TMP_SMOKE/venv/bin/agyis" --version
          "$TMP_SMOKE/venv/bin/agyis" audit aff
          "$TMP_SMOKE/venv/bin/agyis" init --yes --stack python
          "$TMP_SMOKE/venv/bin/agyis" test
          if "$TMP_SMOKE/venv/bin/agyis" audit inventory 2>"$TMP_SMOKE/audit_err.log"; then
            echo "::error::Expected pipeline-only audit stage to exit non-zero in wheel distribution"
            exit 1
          fi
          grep -q "source checkout" "$TMP_SMOKE/audit_err.log"
          echo "CI isolated wheel end-to-end smoke test passed."

name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Execute hermetic test suite
        run: |
          uv run python3 -m harness.cli test

      - name: Build wheel and source distribution
        run: |
          uv build --clear

      - name: Verify build artifacts
        run: |
          ls -lh dist/
          test -f dist/agyis_harness-*.whl
          test -f dist/agyis_harness-*.tar.gz
          sha256sum dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0-rc3")
          fi
          echo "Target release tag: $TAG"
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ (rc|alpha|beta|dev) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/updating distribution artifacts..."
            gh release upload "$TAG" dist/agyis_harness-*.whl dist/agyis_harness-*.tar.gz --clobber
          else
            echo "Creating GitHub Release for $TAG ($PRERELEASE_FLAG)..."
            gh release create "$TAG" dist/agyis_harness-*.whl dist/agyis_harness-*.tar.gz \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
